# Build the unsigned Media Storage archive and upload it to MinIO.
# Set MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, and MINIO_BUCKET
# in GitLab CI/CD variables. Do not commit those values.
stages:
  - package
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  DEBIAN_FRONTEND: noninteractive

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

package:
  stage: package
  tags:
    - docker
  image: node:24-bookworm
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3
    - npm ci --ignore-scripts
    - npm test
    - npm run package
    - python3 tests/package_release.py
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*.tar.gz.sha256
    expire_in: 14 days

publish:
  stage: publish
  tags:
    - docker
  image: debian:bookworm-slim
  needs:
    - job: package
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG && $MINIO_ENDPOINT && $MINIO_ACCESS_KEY && $MINIO_SECRET_KEY && $MINIO_BUCKET
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $MINIO_ENDPOINT && $MINIO_ACCESS_KEY && $MINIO_SECRET_KEY && $MINIO_BUCKET
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates python3
    - sh scripts/publish-minio.sh dist
